<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motif – shape row</title>
<meta name="description" content="Describe shapes in plain words, such as purple square, blue circle. Motif repeats them in a scrollable row of 50, turning and resizing them as you choose.">
<meta property="og:type" content="website">
<meta property="og:title" content="Motif – shape row">
<meta property="og:description" content="Describe shapes in plain words and watch them repeat, turn and resize along a row of 50.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#EEEEEE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEEEEE; --card:#FFFFFF; --rule:#6B6B6B; --ink:#1A1F36; --muted:#555D70; --soft:#CFCFCF;
  --action:#D93A12; --focus:#2D35C8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Familjen Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.4;color:var(--ink);background:var(--rule);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* the board follows the wireframe: one wide panel on top, two panels underneath */
.board{display:grid;grid-template-columns:minmax(300px,32%) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(250px,30dvh);gap:1px;height:100vh;height:100dvh;padding:1px;background:var(--rule)}
.board>section{background:var(--paper);min-width:0;min-height:0}

/* top: the row of shapes */
.row-panel{grid-column:1/-1;position:relative}
.row-head{position:absolute;z-index:2;top:12px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;letter-spacing:-.015em}
.brand small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.steps{display:flex;gap:6px;pointer-events:auto}
.step{width:38px;height:34px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-size:18px;font-weight:600;cursor:pointer;line-height:1}
.step:hover{background:#F6F6F6}
.step:active{transform:translateY(1px)}

.row{height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.row::-webkit-scrollbar{height:26px}
.row::-webkit-scrollbar-track{background:#D9D9D9;border-top:1px solid var(--rule)}
.row::-webkit-scrollbar-thumb{background:#555;border-radius:14px;border:5px solid #D9D9D9}
@supports not selector(::-webkit-scrollbar){.row{scrollbar-color:#555 #D9D9D9;scrollbar-width:auto}}
.items{list-style:none;margin:0;padding:0 max(9vw,28px);display:flex;align-items:center;gap:28px;height:100%;width:max-content}
.items li{position:relative;display:flex;align-items:center;height:100%;scroll-snap-align:center;flex:none}
.items svg{display:block;overflow:visible}
.num{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* bottom left: describe the shapes */
.chat-panel{display:flex;flex-direction:column;padding:14px 16px}
.chat-panel label.title{font-size:15px;font-weight:700;margin-bottom:8px}
.log{flex:1;min-height:0;overflow-y:auto;display:grid;gap:8px;align-content:start;padding:2px 2px 6px}
.msg{font-size:13.5px;line-height:1.45;max-width:94%}
.msg p{margin:0}
.msg ol{margin:5px 0 0;padding-left:20px}
.msg.you{justify-self:end;background:var(--ink);color:#fff;border-radius:10px 10px 2px 10px;padding:6px 11px}
.msg.bot{background:var(--card);border:1px solid var(--soft);border-radius:10px 10px 10px 2px;padding:7px 11px}
.msg.bot p+p{margin-top:4px;color:var(--muted)}
.say{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
.say textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;resize:none;min-height:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#F6F6F6}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}

/* bottom right: controls */
.controls-panel{display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:14px 18px}
.ctl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-size:15px;font-weight:700;margin-bottom:8px}
.ctl-grid label.field{display:grid;gap:4px;margin-bottom:10px;font-weight:500}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:7px 8px;width:100%}
.check{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px;font-weight:500;cursor:pointer}
.check input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--action);flex:none}
.ctl-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--soft);padding-top:12px}
.summary{margin:0;color:var(--muted)}

@media (max-width:860px){
  .board{grid-template-columns:1fr;grid-template-rows:minmax(300px,46dvh) auto auto;height:auto}
  .chat-panel{min-height:340px}
  .log{max-height:260px}
}
@media (max-width:560px){
  .ctl-grid{grid-template-columns:1fr}
  .brand small{display:none}
  .ctl-foot{flex-direction:column;align-items:stretch}
}
@media (prefers-reduced-motion:reduce){.row{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="board">

  <section class="row-panel" aria-label="Shape row">
    <div class="row-head">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3l10.4 6v12L15 27 4.6 21V9z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="15" cy="15" r="5.5" fill="#FF5A2C"/></svg>
        Motif <small>50 shapes, scroll sideways</small>
      </div>
      <div class="steps">
        <button type="button" class="step" id="prev" aria-label="Previous shape">&#8249;</button>
        <button type="button" class="step" id="next" aria-label="Next shape">&#8250;</button>
      </div>
    </div>
    <div class="row" id="row" tabindex="0" role="region" aria-label="Row of 50 shapes. Scroll sideways to see them all.">
      <ol class="items" id="items" role="list"></ol>
    </div>
  </section>

  <section class="chat-panel" aria-label="Describe your shapes">
    <label class="title" for="say">Describe your shapes here:</label>
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <form class="say" id="sayForm">
      <textarea id="say" rows="2" placeholder="purple square, blue circle" spellcheck="false"></textarea>
      <button type="submit" class="btn primary">Send</button>
    </form>
  </section>

  <section class="controls-panel" aria-label="Rotation and size controls">
    <div class="ctl-grid">
      <fieldset>
        <legend>Rotation</legend>
        <label class="field">Direction
          <select id="dir"><option value="cw">Clockwise</option><option value="ccw">Counterclockwise</option></select>
        </label>
        <label class="field">Turn per repeat
          <select id="step"><option value="45">45°</option><option value="90">90°</option><option value="180">180°</option></select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Size</legend>
        <label class="field">Along the row
          <select id="size"><option value="dec">Decreasing</option><option value="same">Same</option><option value="inc">Increasing</option></select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Options</legend>
        <label class="check"><input type="checkbox" id="optNumbers"> Number the shapes</label>
        <label class="check"><input type="checkbox" id="optOutline"> Outlines only</label>
        <label class="check"><input type="checkbox" id="optEvery"> Turn every shape, not once per repeat</label>
      </fieldset>
    </div>
    <div class="ctl-foot">
      <p class="summary" id="summary"></p>
      <button type="button" class="btn primary" id="rand">Randomize</button>
    </div>
    <p class="sr-only" id="liveNote" role="status"></p>
  </section>

</main>

<script>
(() => {
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const COUNT = 50, MAX_SPECS = 24, MAX_REPEAT = 12;
const STORE_KEY = 'motif.row.v1';
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const f3 = v => String(Math.round(v * 1000) / 1000);

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) n.setAttribute(k, attrs[k]);
  n.append(...kids);
  return n;
}
function svgEl(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* ---------- vocabulary ---------- */
const COLORS = {
  red: '#E3242B', orange: '#FF8000', yellow: '#FFD500', green: '#00A651', teal: '#00A6A6', cyan: '#00B7EB',
  blue: '#0000FF', navy: '#0A1F6B', purple: '#9900FF', violet: '#7F00FF', indigo: '#4B0082', pink: '#FF4DA6',
  magenta: '#E6007E', brown: '#8B5A2B', black: '#111111', white: '#FFFFFF', gray: '#8A8F98', grey: '#8A8F98',
  gold: '#D4A017', silver: '#C0C0C0', lime: '#7ED321', maroon: '#800020', turquoise: '#30D5C8', coral: '#FF6F61',
  beige: '#E8D8B0', tan: '#D2B48C'
};
const DEFAULT_COLORS = [['purple', '#9900FF'], ['blue', '#0000FF'], ['green', '#00A651'], ['orange', '#FF8000'], ['pink', '#FF4DA6'], ['teal', '#00A6A6']];
const SIZES = { tiny: 0.45, small: 0.65, little: 0.65, medium: 1, large: 1.3, big: 1.3, huge: 1.6, giant: 1.6 };
const HOLLOW = new Set(['hollow', 'outlined', 'outline', 'empty', 'unfilled']);
const NUMWORDS = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12 };
const STOP = new Set(['a', 'an', 'the', 'of', 'some', 'shape', 'shapes', 'please', 'me', 'make', 'add', 'with', 'in', 'then', 'color', 'colour', 'colored', 'coloured', 'sized', 'size', 'each', 'every']);
const ALIASES = {
  square: 'square', box: 'square', rectangle: 'rectangle', rect: 'rectangle', circle: 'circle', dot: 'circle', ball: 'circle',
  oval: 'oval', ellipse: 'oval', triangle: 'triangle', diamond: 'diamond', rhombus: 'diamond', pentagon: 'pentagon',
  hexagon: 'hexagon', octagon: 'octagon', star: 'star', heart: 'heart', cross: 'cross', plus: 'cross'
};
const SHAPE_NAMES = ['square', 'rectangle', 'circle', 'oval', 'triangle', 'diamond', 'pentagon', 'hexagon', 'octagon', 'star', 'heart', 'cross'];

function shapeOf(t) {
  if (ALIASES[t]) return ALIASES[t];
  if (t.endsWith('es') && ALIASES[t.slice(0, -2)]) return ALIASES[t.slice(0, -2)];
  if (t.endsWith('s') && ALIASES[t.slice(0, -1)]) return ALIASES[t.slice(0, -1)];
  return null;
}

/* ---------- geometry (radius 1 means half the base box) ---------- */
const reg = (n, r, a0) => Array.from({ length: n }, (_, i) => { const a = (a0 === undefined ? -Math.PI / 2 : a0) + TAU * i / n; return [r * Math.cos(a), r * Math.sin(a)]; });
const star = (() => { const p = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.48 : 1.2, a = -Math.PI / 2 + Math.PI * i / 5; p.push([r * Math.cos(a), r * Math.sin(a)]); } return p; })();
const heart = (() => {
  const p = [];
  for (let i = 0; i < 72; i++) {
    const t = TAU * i / 72;
    p.push([16 * Math.pow(Math.sin(t), 3) / 16, (-(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.5) / 16]);
  }
  return p;
})();
const GEOM = {
  square: { pts: [[-1, -1], [1, -1], [1, 1], [-1, 1]] },
  rectangle: { pts: [[-1.3, -0.8], [1.3, -0.8], [1.3, 0.8], [-1.3, 0.8]] },
  circle: { ell: [1, 1] },
  oval: { ell: [1.3, 0.8] },
  triangle: { pts: reg(3, 1.15) },
  diamond: { pts: [[0, -1.25], [0.85, 0], [0, 1.25], [-0.85, 0]] },
  pentagon: { pts: reg(5, 1.05) },
  hexagon: { pts: reg(6, 1.05) },
  octagon: { pts: reg(8, 1.05, -Math.PI / 2 + Math.PI / 8) },
  star: { pts: star },
  heart: { pts: heart },
  cross: { pts: [[-0.35, -1.1], [0.35, -1.1], [0.35, -0.35], [1.1, -0.35], [1.1, 0.35], [0.35, 0.35], [0.35, 1.1], [-0.35, 1.1], [-0.35, 0.35], [-1.1, 0.35], [-1.1, -0.35], [-0.35, -0.35]] }
};

/* ---------- reading what the person typed ---------- */
function parseShapes(text) {
  const out = { specs: [], unknown: [], truncated: false };
  const cleaned = text.toLowerCase().replace(/[“”"'`]/g, '');
  const segments = cleaned.split(/[,;\n]+|\s+(?:and then|then|followed by|after that|next|and)\s+|\s*(?:->|→|=>|>)\s*/);
  for (const seg of segments) {
    if (!seg.trim()) continue;
    let count = 1, color = null, size = 1, sizeWord = '', hollow = false;
    const shapes = [], unk = [];
    const s = seg.replace(/(?:^|\s)[x×]\s*(\d+)\b/, (m, d) => { count = +d; return ' '; });
    const toks = s.match(/[a-z]+|\d+/g) || [];
    for (const tk of toks) {
      if (/^\d+$/.test(tk)) { count = +tk; continue; }
      if (NUMWORDS[tk] !== undefined) { count = NUMWORDS[tk]; continue; }
      if (STOP.has(tk)) continue;
      if (COLORS[tk]) { color = [tk === 'grey' ? 'gray' : tk, COLORS[tk]]; continue; }
      if (SIZES[tk] !== undefined) { size = SIZES[tk]; sizeWord = tk === 'little' ? 'small' : tk; continue; }
      if (HOLLOW.has(tk)) { hollow = true; continue; }
      const sh = shapeOf(tk);
      if (sh) { shapes.push(sh); continue; }
      unk.push(tk);
    }
    if (!shapes.length) { if (toks.some(t => !STOP.has(t))) out.unknown.push(seg.trim()); continue; }
    out.unknown.push(...unk);
    count = clamp(count, 1, MAX_REPEAT);
    for (const sh of shapes) for (let c = 0; c < count; c++) out.specs.push({ shape: sh, color, size, sizeWord, hollow });
  }
  if (out.specs.length > MAX_SPECS) { out.specs.length = MAX_SPECS; out.truncated = true; }
  out.specs.forEach((sp, i) => {
    const c = sp.color || DEFAULT_COLORS[i % DEFAULT_COLORS.length];
    sp.colorName = c[0]; sp.hex = c[1];
    sp.label = cap([sp.hollow ? 'hollow' : '', sp.sizeWord, sp.colorName, sp.shape].filter(Boolean).join(' '));
  });
  return out;
}

/* ---------- state ---------- */
const state = { text: 'purple square, blue circle', specs: [], dir: 'cw', step: 45, size: 'same', numbers: false, outline: false, every: false };
const refs = {};

/* ---------- the row ---------- */
function makeItem(i, spec, angleDeg, k, turnedDeg) {
  const a = angleDeg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), g = GEOM[spec.shape];
  const hollow = spec.hollow || state.outline;
  const pad = 0.06;
  let minx, maxx, miny, maxy, node;
  const paint = {
    fill: hollow ? 'none' : spec.hex,
    stroke: hollow ? (spec.hex.toUpperCase() === '#FFFFFF' ? '#666666' : spec.hex) : 'rgba(0,0,0,0.55)',
    'stroke-width': hollow ? '3' : '1.5',
    'stroke-linejoin': 'round',
    'vector-effect': 'non-scaling-stroke'
  };
  if (g.ell) {
    const rx = g.ell[0] * k, ry = g.ell[1] * k;
    const hw = Math.sqrt(Math.pow(rx * ca, 2) + Math.pow(ry * sa, 2)), hh = Math.sqrt(Math.pow(rx * sa, 2) + Math.pow(ry * ca, 2));
    minx = -hw; maxx = hw; miny = -hh; maxy = hh;
    node = svgEl('ellipse', Object.assign({ cx: 0, cy: 0, rx: f3(rx), ry: f3(ry), transform: 'rotate(' + f3(angleDeg) + ')' }, paint));
  } else {
    const pts = g.pts.map(p => [k * (p[0] * ca - p[1] * sa), k * (p[0] * sa + p[1] * ca)]);
    minx = Math.min(...pts.map(p => p[0])); maxx = Math.max(...pts.map(p => p[0]));
    miny = Math.min(...pts.map(p => p[1])); maxy = Math.max(...pts.map(p => p[1]));
    node = svgEl('polygon', Object.assign({ points: pts.map(p => f3(p[0]) + ',' + f3(p[1])).join(' ') }, paint));
  }
  const w = maxx - minx + 2 * pad, h = maxy - miny + 2 * pad;
  const svg = svgEl('svg', { viewBox: f3(minx - pad) + ' ' + f3(miny - pad) + ' ' + f3(w) + ' ' + f3(h), 'aria-hidden': 'true', focusable: 'false' });
  svg.style.width = 'calc(var(--u) * ' + f3(w) + ')';
  svg.style.height = 'calc(var(--u) * ' + f3(h) + ')';
  svg.append(node);
  const dirWord = state.dir === 'cw' ? 'clockwise' : 'counterclockwise';
  const li = el('li', {}, svg, el('span', { class: 'sr-only' }, 'Item ' + (i + 1) + ': ' + spec.label.toLowerCase() + (hollow && !spec.hollow ? ', outline only' : '') + (turnedDeg ? ', turned ' + turnedDeg + ' degrees ' + dirWord : ', not turned')));
  if (state.numbers) li.append(el('span', { class: 'num', 'aria-hidden': 'true' }, String(i + 1)));
  return li;
}

function renderRow() {
  const items = refs.items, n = state.specs.length;
  items.replaceChildren();
  if (!n) return;
  const sign = state.dir === 'cw' ? 1 : -1;
  for (let i = 0; i < COUNT; i++) {
    const spec = state.specs[i % n], cycle = Math.floor(i / n);
    const turns = state.every ? i : cycle;
    const t = i / (COUNT - 1);
    const sizeScale = state.size === 'dec' ? 1 - 0.75 * t : state.size === 'inc' ? 0.25 + 0.75 * t : 1;
    items.append(makeItem(i, spec, turns * state.step * sign, sizeScale * spec.size, (turns * state.step) % 360));
  }
}
function setUnit() {
  refs.row.style.setProperty('--u', clamp(refs.row.clientHeight * 0.13, 24, 56) + 'px');
}
function stepItem(dir) {
  const items = [...refs.items.children];
  if (!items.length) return;
  const r = refs.row.getBoundingClientRect(), mid = r.left + r.width / 2;
  let cur = 0, best = Infinity;
  items.forEach((li, i) => { const b = li.getBoundingClientRect(), d = Math.abs(b.left + b.width / 2 - mid); if (d < best) { best = d; cur = i; } });
  const target = items[clamp(cur + dir, 0, items.length - 1)];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tb = target.getBoundingClientRect();
  refs.row.scrollTo({ left: refs.row.scrollLeft + (tb.left + tb.width / 2 - mid), behavior: reduce ? 'auto' : 'smooth' });
}

/* ---------- controls ---------- */
function updateSummary() {
  const dirWord = state.dir === 'cw' ? 'clockwise' : 'counterclockwise';
  const turn = state.every ? 'Every shape turns ' : 'Each repeat of your list turns ';
  const size = state.size === 'dec' ? 'Sizes shrink along the row.' : state.size === 'inc' ? 'Sizes grow along the row.' : 'Sizes stay the same.';
  refs.summary.textContent = turn + state.step + '° ' + dirWord + '. ' + size;
}
function syncControls() {
  refs.dir.value = state.dir; refs.step.value = String(state.step); refs.size.value = state.size;
  refs.optNumbers.checked = state.numbers; refs.optOutline.checked = state.outline; refs.optEvery.checked = state.every;
}
function changed(note) {
  updateSummary(); renderRow(); persist();
  if (note) refs.liveNote.textContent = note;
}
function randomize() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  state.dir = pick(['cw', 'ccw']); state.step = pick([45, 90, 180]); state.size = pick(['dec', 'same', 'inc']);
  syncControls();
  changed('Random settings: ' + refs.dir.selectedOptions[0].text + ', ' + state.step + ' degrees, ' + refs.size.selectedOptions[0].text);
  refs.row.scrollTo({ left: 0 });
}

/* ---------- the chat ---------- */
function addMsg(kind, ...kids) {
  const m = el('div', { class: 'msg ' + kind }, ...kids);
  refs.log.append(m);
  refs.log.scrollTop = refs.log.scrollHeight;
  return m;
}
function groupList(specs) {
  const ol = el('ol');
  for (let i = 0; i < specs.length;) {
    let j = i;
    while (j < specs.length && specs[j].label === specs[i].label) j++;
    ol.append(el('li', {}, specs[i].label + (j - i > 1 ? ' ×' + (j - i) : '')));
    i = j;
  }
  return ol;
}
function send(text, silentUser) {
  text = text.trim();
  if (!text) return;
  if (!silentUser) addMsg('you', text);
  const res = parseShapes(text);
  if (!res.specs.length) {
    addMsg('bot', el('p', {}, 'I couldn’t find a shape in that. Try something like “purple square, blue circle”.'));
    return;
  }
  state.text = text; state.specs = res.specs;
  const bits = [el('p', {}, 'Got it: ' + res.specs.length + (res.specs.length === 1 ? ' shape' : ' shapes') + ', repeating along the row.'), groupList(res.specs)];
  if (res.unknown.length) bits.push(el('p', {}, 'I skipped: ' + [...new Set(res.unknown)].join(', ') + '.'));
  if (res.truncated) bits.push(el('p', {}, 'I kept the first ' + MAX_SPECS + ' shapes.'));
  addMsg('bot', ...bits);
  renderRow(); persist();
  refs.row.scrollTo({ left: 0 });
}

function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ text: state.text, dir: state.dir, step: state.step, size: state.size, numbers: state.numbers, outline: state.outline, every: state.every }));
  } catch (e) { /* storage unavailable */ }
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!d) return;
    if (typeof d.text === 'string' && d.text.trim()) state.text = d.text.slice(0, 600);
    if (d.dir === 'cw' || d.dir === 'ccw') state.dir = d.dir;
    if ([45, 90, 180].includes(d.step)) state.step = d.step;
    if (['dec', 'same', 'inc'].includes(d.size)) state.size = d.size;
    state.numbers = !!d.numbers; state.outline = !!d.outline; state.every = !!d.every;
  } catch (e) { /* ignore bad saved data */ }
}

/* ---------- start up ---------- */
function init() {
  Object.assign(refs, {
    row: $('#row'), items: $('#items'), log: $('#log'), say: $('#say'), summary: $('#summary'), liveNote: $('#liveNote'),
    dir: $('#dir'), step: $('#step'), size: $('#size'), optNumbers: $('#optNumbers'), optOutline: $('#optOutline'), optEvery: $('#optEvery')
  });
  restore();
  syncControls();

  refs.dir.addEventListener('change', () => { state.dir = refs.dir.value; changed(); });
  refs.step.addEventListener('change', () => { state.step = +refs.step.value; changed(); });
  refs.size.addEventListener('change', () => { state.size = refs.size.value; changed(); });
  refs.optNumbers.addEventListener('change', () => { state.numbers = refs.optNumbers.checked; changed(); });
  refs.optOutline.addEventListener('change', () => { state.outline = refs.optOutline.checked; changed(); });
  refs.optEvery.addEventListener('change', () => { state.every = refs.optEvery.checked; changed(); });
  $('#rand').addEventListener('click', randomize);
  $('#prev').addEventListener('click', () => stepItem(-1));
  $('#next').addEventListener('click', () => stepItem(1));

  $('#sayForm').addEventListener('submit', e => { e.preventDefault(); send(refs.say.value); refs.say.value = ''; refs.say.focus(); });
  refs.say.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#sayForm').requestSubmit(); }
  });

  // turn a vertical mouse wheel into sideways scrolling along the row
  refs.row.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { refs.row.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });

  if ('ResizeObserver' in window) new ResizeObserver(setUnit).observe(refs.row);
  else window.addEventListener('resize', setUnit);
  setUnit();

  addMsg('bot',
    el('p', {}, 'Tell me the shapes in order and I’ll repeat them along the row. Colours, sizes (small, large), counts (3 red triangles) and hollow all work.'),
    el('p', {}, 'Shapes I know: ' + SHAPE_NAMES.join(', ') + '.'));
  updateSummary();
  send(state.text);
}

/* __EXPOSE__ */
init();
})();
</script>
</body>
</html>
