<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motif - A Pattern of Shapes</title>
<link rel="icon" href="motif-logo.svg" type="image/svg+xml">
<meta name="description" content="Click shapes to build a sequence, pick a colour and size for each, and Motif repeats it along a scrollable row of 36, turning and resizing the shapes as you choose.">
<meta property="og:type" content="website">
<meta property="og:title" content="Motif – shape row">
<meta property="og:description" content="Build a sequence of shapes with clicks, then watch it repeat, turn and resize along a row of 36.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#EEEEEE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEEEEE; --card:#FFFFFF; --rule:#6B6B6B; --ink:#1A1F36; --muted:#555D70; --soft:#CFCFCF;
  --action:#D93A12; --focus:#2D35C8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Familjen Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.4;color:var(--ink);background:var(--rule);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* the board follows the wireframe: one wide panel on top, two panels underneath */
.board{display:grid;grid-template-columns:minmax(340px,56%) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(300px,42dvh);gap:1px;height:100vh;height:100dvh;padding:1px;background:var(--rule)}
.board>section{background:var(--paper);min-width:0;min-height:0}

/* top: the row of shapes */
.row-panel{grid-column:1/-1;position:relative}
.row-head{position:absolute;z-index:2;top:12px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;letter-spacing:-.015em}
.brand small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.steps{display:flex;gap:6px;pointer-events:auto}
.step{width:38px;height:34px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-size:18px;font-weight:600;cursor:pointer;line-height:1}
.step:hover{background:#F6F6F6}
.step:active{transform:translateY(1px)}
.row-empty{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:0 24px;text-align:center;font-size:16px;color:var(--muted);pointer-events:none}
.row-empty[hidden]{display:none}

.row{height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.row::-webkit-scrollbar{height:26px}
.row::-webkit-scrollbar-track{background:#D9D9D9;border-top:1px solid var(--rule)}
.row::-webkit-scrollbar-thumb{background:#555;border-radius:14px;border:5px solid #D9D9D9}
@supports not selector(::-webkit-scrollbar){.row{scrollbar-color:#555 #D9D9D9;scrollbar-width:auto}}
.items{list-style:none;margin:0;padding:0 max(9vw,28px);display:flex;align-items:center;gap:28px;height:100%;width:max-content}
.items li{position:relative;display:flex;align-items:center;height:100%;scroll-snap-align:center;flex:none}
.items svg{display:block;overflow:visible}
.num{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* bottom left: pick shapes and tune each one */
.build-panel{display:flex;flex-direction:column;padding:14px 16px 12px 12px}
.title{margin:0 0 8px 4px;font-size:15px;font-weight:700}
.palette{display:flex;justify-content:space-evenly;margin:0 0 6px}
.pal{flex:0 1 52px;min-width:36px;height:auto;aspect-ratio:1/1;padding:7px;border:1.5px solid var(--rule);border-radius:14px;background:var(--card);cursor:pointer;display:grid;place-items:center}
.pal:hover{background:#F6F6F6}
.pal:active{transform:translateY(1px)}
.pal[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.pal[aria-disabled="true"]:hover,.pal[aria-disabled="true"]:active{background:var(--card);transform:none}
.pal svg{display:block;width:100%;height:100%;overflow:visible}
.status{margin:0 0 8px 4px;min-height:20px;color:var(--muted);font-size:13px}
.list-wrap{flex:1;min-height:0}
.empty{margin:6px 4px;color:var(--muted)}
.empty[hidden]{display:none}

/* the scrollbar sits on the left, as in the wireframe */
.list{list-style:none;margin:0;padding:2px 2px 6px 10px;height:100%;overflow-y:auto;direction:rtl;scrollbar-gutter:stable;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start}
.list::-webkit-scrollbar{width:16px}
.list::-webkit-scrollbar-track{background:#D9D9D9;border-radius:8px}
.list::-webkit-scrollbar-thumb{background:#555;border-radius:8px;border:4px solid #D9D9D9}
@supports not selector(::-webkit-scrollbar){.list{scrollbar-color:#555 #D9D9D9;scrollbar-width:auto}}
.item{direction:ltr;min-width:0;display:flex;align-items:center;gap:10px;padding:7px 12px;border:1.5px solid var(--rule);border-radius:18px;background:var(--card)}
.item.new{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.97);background:#FFF1EA}to{transform:none;background:var(--card)}}
.ico{flex:none;width:40px;height:40px}
.ico svg{display:block;width:100%;height:100%;overflow:visible}
select,.sz{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:7px 8px}
.color{flex:1 1 96px;min-width:0}
.size{flex:none;display:flex;align-items:center;gap:4px}
.sz{width:56px;text-align:center;font-variant-numeric:tabular-nums;appearance:textfield;-moz-appearance:textfield}
.sz::-webkit-outer-spin-button,.sz::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mini{width:30px;height:32px;padding:0;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:19px;font-weight:600;line-height:1;cursor:pointer}
.mini:hover{background:#F6F6F6}
.mini:active{transform:translateY(1px)}
.del{flex:none;width:36px;height:36px;padding:0;margin-left:auto;border:1.5px solid var(--rule);border-radius:50%;background:var(--card);cursor:pointer;display:grid;place-items:center}
.del:hover{background:#FFF1EA}
.del svg{display:block;width:20px;height:20px}

/* bottom right: controls */
.controls-panel{display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:14px 18px}
.ctl-grid{display:flex;flex-wrap:wrap;gap:18px}
.ctl-grid>fieldset{flex:1 1 140px}
.ctl-grid>fieldset:first-child{flex:1.4 1 190px}
.ctl-grid>fieldset:last-child{flex:1 1 150px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-size:15px;font-weight:700;margin-bottom:8px}
label.field{display:grid;gap:4px;margin-bottom:10px;font-weight:500}
label.field select{width:100%}
.sel-wrap{position:relative;display:block}
.dir-ico{position:absolute;left:9px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--ink);pointer-events:none}
#dir{padding-left:35px}
.check{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px;font-weight:500;cursor:pointer}
.check input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--action);flex:none}
.ctl-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--soft);padding-top:12px}
.summary{margin:0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#F6F6F6}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff;flex:none}
.btn.primary:hover{filter:brightness(1.08)}

@media (max-width:860px){
  .board{grid-template-columns:1fr;grid-template-rows:minmax(300px,46dvh) auto auto;height:auto}
  .list-wrap{flex:none}
  .list{height:auto;max-height:300px}
}
@media (max-width:560px){
  .brand small{display:none}
  .ctl-foot{flex-direction:column;align-items:stretch}
  .item{display:grid;grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"ico color del" "ico size del";gap:6px 10px;align-items:center;padding:8px 10px}
  .ico{grid-area:ico;width:36px;height:36px}
  .color{grid-area:color;width:100%}
  .size{grid-area:size}
  .del{grid-area:del;margin-left:0}
}
@media (prefers-reduced-motion:reduce){.row{scroll-behavior:auto}.item.new{animation:none}}
</style>
</head>
<body>
<main class="board">

  <section class="row-panel" aria-label="Shape row">
    <div class="row-head">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3l10.4 6v12L15 27 4.6 21V9z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="15" cy="15" r="5.5" fill="#FF5A2C"/></svg>
        Motif <small>36 shapes, scroll sideways</small>
      </div>
      <div class="steps">
        <button type="button" class="step" id="prev" aria-label="Previous shape">&#8249;</button>
        <button type="button" class="step" id="next" aria-label="Next shape">&#8250;</button>
      </div>
    </div>
    <p class="row-empty" id="rowEmpty" hidden>Add a shape below to start your row.</p>
    <div class="row" id="row" tabindex="0" role="region" aria-label="Row of 36 shapes. Scroll sideways to see them all.">
      <ol class="items" id="items" role="list"></ol>
    </div>
  </section>

  <section class="build-panel" aria-label="Your shapes">
    <h2 class="title" id="addTitle">Add a shape</h2>
    <div class="palette" id="palette" role="group" aria-labelledby="addTitle"></div>
    <p class="status" id="status" role="status"></p>
    <div class="list-wrap">
      <p class="empty" id="empty" hidden>Your list is empty. Click a shape above to add one.</p>
      <ol class="list" id="list" aria-label="Your shapes, in row order"></ol>
    </div>
  </section>

  <section class="controls-panel" aria-label="Rotation and size controls">
    <div class="ctl-grid">
      <fieldset>
        <legend>Rotation</legend>
        <label class="field">Direction
          <span class="sel-wrap">
            <svg class="dir-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g id="dirArrow"><path d="M19 12A7 7 0 1 1 15.5 5.94" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.4 7.04L13.33 7.69L15.93 3.19Z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></g></svg>
            <select id="dir"><option value="cw">Clockwise</option><option value="ccw">Counterclockwise</option></select>
          </span>
        </label>
        <label class="field">Turn per repeat
          <select id="step"><option value="45">45°</option><option value="90">90°</option><option value="180">180°</option></select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Size</legend>
        <label class="field">Along the row
          <select id="size"><option value="dec">Decreasing</option><option value="same">Same</option><option value="inc">Increasing</option></select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Options</legend>
        <label class="check"><input type="checkbox" id="optNumbers"> Number shapes</label>
        <label class="check"><input type="checkbox" id="optOutline"> Outlines only</label>
        <label class="check"><input type="checkbox" id="optEvery"> Turn every shape</label>
      </fieldset>
    </div>
    <div class="ctl-foot">
      <p class="summary" id="summary"></p>
      <button type="button" class="btn primary" id="rand">Randomize</button>
    </div>
    <p class="sr-only" id="liveNote" role="status"></p>
  </section>

</main>

<script>
(() => {
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const COUNT = 36, MAX_ITEMS = 4, MIN_SIZE = 1, MAX_SIZE = 10, DEFAULT_SIZE = 5, STEP = 0.05;
const STORE_KEY = 'motif.row.v3';
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const f3 = v => String(Math.round(v * 1000) / 1000);

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) n.setAttribute(k, attrs[k]);
  n.append(...kids);
  return n;
}
function svgEl(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* ---------- the premade lists ---------- */
const COLORS = [
  ['Red', '#E3242B'], ['Orange', '#FF8000'], ['Yellow', '#FFD500'], ['Green', '#00A651'], ['Teal', '#00A6A6'], ['Blue', '#0000FF'],
  ['Purple', '#9900FF'], ['Pink', '#FF4DA6'], ['Brown', '#8B5A2B'], ['Black', '#111111'], ['White', '#FFFFFF'], ['Gray', '#8A8F98']
];
const COLOR_HEX = {};
COLORS.forEach(([n, h]) => { COLOR_HEX[n.toLowerCase()] = h; });
const CYCLE = ['purple', 'blue', 'green', 'orange', 'pink', 'teal'];

const reg = (n, r, a0) => Array.from({ length: n }, (_, i) => {
  const a = (a0 === undefined ? -Math.PI / 2 : a0) + TAU * i / n;
  return [r * Math.cos(a), r * Math.sin(a)];
});
const GEOM = {
  circle: { ell: [1, 1] },
  triangle: { pts: reg(3, 1.15) },
  square: { pts: [[-1, -1], [1, -1], [1, 1], [-1, 1]] },
  diamond: { pts: [[0, -1.25], [0.85, 0], [0, 1.25], [-0.85, 0]] },
  pentagon: { pts: reg(5, 1.05) },
  hexagon: { pts: reg(6, 1.05) },
  heptagon: { pts: reg(7, 1.05) },
  octagon: { pts: reg(8, 1.05, -Math.PI / 2 + Math.PI / 8) }
};
const SHAPES = ['circle', 'triangle', 'square', 'diamond', 'pentagon', 'hexagon', 'heptagon', 'octagon'];
// furthest point from the centre, so a turned shape still fits inside the row
const RADIUS = {};
SHAPES.forEach(s => { const g = GEOM[s]; RADIUS[s] = g.ell ? Math.max(...g.ell) : Math.max(...g.pts.map(p => Math.hypot(p[0], p[1]))); });

/* ---------- drawing one shape ---------- */
function build(shape, k, angleDeg, paint) {
  const a = angleDeg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), g = GEOM[shape];
  if (g.ell) {
    const rx = g.ell[0] * k, ry = g.ell[1] * k;
    const hw = Math.hypot(rx * ca, ry * sa), hh = Math.hypot(rx * sa, ry * ca);
    return {
      minx: -hw, maxx: hw, miny: -hh, maxy: hh,
      node: svgEl('ellipse', Object.assign({ cx: 0, cy: 0, rx: f3(rx), ry: f3(ry), transform: 'rotate(' + f3(angleDeg) + ')' }, paint))
    };
  }
  const pts = g.pts.map(p => [k * (p[0] * ca - p[1] * sa), k * (p[0] * sa + p[1] * ca)]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return {
    minx: Math.min(...xs), maxx: Math.max(...xs), miny: Math.min(...ys), maxy: Math.max(...ys),
    node: svgEl('polygon', Object.assign({ points: pts.map(p => f3(p[0]) + ',' + f3(p[1])).join(' ') }, paint))
  };
}
const paintOf = (hex, hollow) => ({
  fill: hollow ? 'none' : hex,
  stroke: hollow ? (hex.toUpperCase() === '#FFFFFF' ? '#666666' : hex) : 'rgba(0,0,0,0.55)',
  'stroke-width': hollow ? '3' : '1.5',
  'stroke-linejoin': 'round',
  'vector-effect': 'non-scaling-stroke'
});
function icon(shape, paint) {
  const b = build(shape, 1, 0, paint), h = 1.4, cx = (b.minx + b.maxx) / 2, cy = (b.miny + b.maxy) / 2;
  const svg = svgEl('svg', { viewBox: f3(cx - h) + ' ' + f3(cy - h) + ' ' + f3(2 * h) + ' ' + f3(2 * h), 'aria-hidden': 'true', focusable: 'false' });
  svg.append(b.node);
  return svg;
}
const PALETTE_PAINT = { fill: 'none', stroke: '#1A1F36', 'stroke-width': '2', 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' };

/* ---------- state ---------- */
const state = { items: [], nid: 0, dir: 'cw', step: 45, size: 'same', numbers: false, outline: false, every: false };
const refs = {};
let unitPx = 56;
const labelOf = it => cap(it.color) + ' ' + it.shape;
const defaultItems = () => [
  { id: ++state.nid, shape: 'square', color: 'purple', size: DEFAULT_SIZE },
  { id: ++state.nid, shape: 'circle', color: 'blue', size: DEFAULT_SIZE }
];

/* ---------- the row ---------- */
function makeItem(i, it, angleDeg, k, turnedDeg, scale) {
  const b = build(it.shape, k, angleDeg, paintOf(COLOR_HEX[it.color], state.outline));
  const pad = 0.06, w = b.maxx - b.minx + 2 * pad, h = b.maxy - b.miny + 2 * pad;
  const svg = svgEl('svg', { viewBox: f3(b.minx - pad) + ' ' + f3(b.miny - pad) + ' ' + f3(w) + ' ' + f3(h), 'aria-hidden': 'true', focusable: 'false' });
  svg.style.width = 'calc(var(--u) * ' + f3(w) + ')';
  svg.style.height = 'calc(var(--u) * ' + f3(h) + ')';
  svg.append(b.node);
  const dirWord = state.dir === 'cw' ? 'clockwise' : 'counterclockwise';
  const li = el('li', {}, svg, el('span', { class: 'sr-only' },
    'Item ' + (i + 1) + ': ' + labelOf(it).toLowerCase() + ', size ' + it.size + (Math.abs(scale - 1) > 0.005 ? ', scaled to ' + Math.round(scale * 100) + ' percent' : '') + (state.outline ? ', outline only' : '') +
    (turnedDeg ? ', turned ' + turnedDeg + ' degrees ' + dirWord : ', not turned')));
  if (state.numbers) li.append(el('span', { class: 'num', 'aria-hidden': 'true' }, String(i + 1)));
  return li;
}
function renderRow() {
  const box = refs.items, n = state.items.length;
  box.replaceChildren();
  refs.rowEmpty.hidden = n > 0;
  if (!n) return;
  const sign = state.dir === 'cw' ? 1 : -1;
  // each shape is 5% smaller or larger than the one before, in width and height alike
  const factor = state.size === 'dec' ? 1 - STEP : state.size === 'inc' ? 1 + STEP : 1;
  let cap = Infinity;
  if (factor > 1) {
    // growth stops once the biggest shape would no longer fit the row
    // offsetHeight, because the sideways scrollbar comes and goes while the row is rebuilt
    const room = Math.max(60, refs.row.offsetHeight - 26 - 112);
    const biggest = Math.max(...state.items.map(x => 2 * RADIUS[x.shape] * (x.size / DEFAULT_SIZE)));
    cap = Math.max(1, (room / unitPx - 0.12) / biggest);
  }
  for (let i = 0; i < COUNT; i++) {
    const it = state.items[i % n], cycle = Math.floor(i / n);
    const turns = state.every ? i : cycle;
    const scale = Math.min(Math.pow(factor, i), cap);
    box.append(makeItem(i, it, turns * state.step * sign, (it.size / DEFAULT_SIZE) * scale, (turns * state.step) % 360, scale));
  }
}
function setUnit() {
  unitPx = clamp(refs.row.clientHeight * 0.13, 24, 56);
  refs.row.style.setProperty('--u', unitPx + 'px');
}
function onResize() {
  setUnit();
  if (state.size === 'inc') renderRow();
}
function stepItem(dir) {
  const lis = [...refs.items.children];
  if (!lis.length) return;
  const r = refs.row.getBoundingClientRect(), mid = r.left + r.width / 2;
  let cur = 0, best = Infinity;
  lis.forEach((li, i) => { const b = li.getBoundingClientRect(), d = Math.abs(b.left + b.width / 2 - mid); if (d < best) { best = d; cur = i; } });
  const tb = lis[clamp(cur + dir, 0, lis.length - 1)].getBoundingClientRect();
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  refs.row.scrollTo({ left: refs.row.scrollLeft + (tb.left + tb.width / 2 - mid), behavior: reduce ? 'auto' : 'smooth' });
}

/* ---------- the list ---------- */
const xIcon = () => {
  const s = svgEl('svg', { viewBox: '0 0 20 20', 'aria-hidden': 'true', focusable: 'false' });
  s.append(svgEl('path', { d: 'M5 5l10 10M15 5L5 15', fill: 'none', stroke: '#D93A12', 'stroke-width': '2.4', 'stroke-linecap': 'round' }));
  return s;
};
function setStatus(msg) {
  const n = state.items.length;
  refs.status.textContent = msg || (n === 0 ? 'Click a shape to start your row.' : n >= MAX_ITEMS ? 'The list is full (' + n + ' of ' + MAX_ITEMS + '). Remove a shape to add another.' : n + ' of ' + MAX_ITEMS + ' shapes in your list.');
}
function rowEl(it, i) {
  const name = it.shape + ' ' + (i + 1);
  const ico = el('span', { class: 'ico' });
  ico.append(icon(it.shape, paintOf(COLOR_HEX[it.color], false)));

  const sel = el('select', { class: 'color', 'aria-label': 'Colour of ' + name }, ...COLORS.map(([n]) => el('option', { value: n.toLowerCase() }, n)));
  sel.value = it.color;
  sel.addEventListener('change', () => {
    it.color = sel.value;
    ico.replaceChildren(icon(it.shape, paintOf(COLOR_HEX[it.color], false)));
    renderRow(); persist();
  });

  const input = el('input', { type: 'number', class: 'sz', min: MIN_SIZE, max: MAX_SIZE, step: 1, inputmode: 'numeric', 'aria-label': 'Size of ' + name + ', ' + MIN_SIZE + ' to ' + MAX_SIZE });
  input.value = it.size;
  const setSize = (v, rewrite) => {
    v = clamp(Math.round(v), MIN_SIZE, MAX_SIZE);
    it.size = v;
    if (rewrite) input.value = v;
    renderRow(); persist();
  };
  input.addEventListener('input', () => { const v = parseFloat(input.value); if (Number.isFinite(v) && v >= MIN_SIZE && v <= MAX_SIZE) setSize(v, false); });
  input.addEventListener('change', () => { const v = parseFloat(input.value); setSize(Number.isFinite(v) ? v : it.size, true); });
  const bump = d => () => setSize(it.size + d, true);
  const minus = el('button', { type: 'button', class: 'mini', 'aria-label': 'Make ' + name + ' smaller', title: 'Smaller' }, '−');
  const plus = el('button', { type: 'button', class: 'mini', 'aria-label': 'Make ' + name + ' larger', title: 'Larger' }, '+');
  minus.addEventListener('click', bump(-1));
  plus.addEventListener('click', bump(1));
  const size = el('div', { class: 'size' }, minus, input, plus);

  const del = el('button', { type: 'button', class: 'del', 'aria-label': 'Remove ' + name, title: 'Remove' });
  del.append(xIcon());
  del.addEventListener('click', () => removeItem(it.id));

  return el('li', { class: 'item' }, ico, sel, size, del);
}
function renderList() {
  refs.list.replaceChildren(...state.items.map(rowEl));
  refs.empty.hidden = state.items.length > 0;
  const full = state.items.length >= MAX_ITEMS;
  refs.palette.querySelectorAll('.pal').forEach(b => b.setAttribute('aria-disabled', String(full)));
}
function addShape(shape) {
  if (state.items.length >= MAX_ITEMS) { setStatus(); return; }
  const it = { id: ++state.nid, shape, color: CYCLE[state.items.length % CYCLE.length], size: DEFAULT_SIZE };
  state.items.push(it);
  renderList();
  refs.list.scrollTop = refs.list.scrollHeight;
  refs.list.lastElementChild.classList.add('new');
  renderRow(); persist();
  setStatus('Added ' + (/^[aeiou]/i.test(it.color) ? 'an ' : 'a ') + labelOf(it).toLowerCase() + '. ' + state.items.length + ' of ' + MAX_ITEMS + ' shapes.');
}
function removeItem(id) {
  const i = state.items.findIndex(x => x.id === id);
  if (i < 0) return;
  const gone = labelOf(state.items[i]).toLowerCase();
  state.items.splice(i, 1);
  renderList(); renderRow(); persist();
  setStatus('Removed the ' + gone + '. ' + state.items.length + ' of ' + MAX_ITEMS + ' shapes.');
  const next = refs.list.children[Math.min(i, state.items.length - 1)];
  (next ? next.querySelector('.del') : refs.palette.firstElementChild).focus();
}

/* ---------- controls ---------- */
function updateSummary() {
  const dirWord = state.dir === 'cw' ? 'clockwise' : 'counterclockwise';
  const turn = state.every ? 'Every shape turns ' : 'Each repeat of your list turns ';
  const pct = Math.round(STEP * 100) + '%';
  const size = state.size === 'dec' ? 'Each shape is ' + pct + ' smaller than the last.' : state.size === 'inc' ? 'Each shape is ' + pct + ' larger than the last.' : 'Sizes stay the same.';
  refs.summary.textContent = turn + state.step + '° ' + dirWord + '. ' + size;
}
function syncDirIcon() {
  // the counterclockwise arrow is the clockwise one mirrored left to right
  if (state.dir === 'ccw') refs.dirArrow.setAttribute('transform', 'translate(24 0) scale(-1 1)');
  else refs.dirArrow.removeAttribute('transform');
}
function syncControls() {
  refs.dir.value = state.dir; refs.step.value = String(state.step); refs.size.value = state.size;
  syncDirIcon();
  refs.optNumbers.checked = state.numbers; refs.optOutline.checked = state.outline; refs.optEvery.checked = state.every;
}
function changed(note) {
  updateSummary(); renderRow(); persist();
  if (note) refs.liveNote.textContent = note;
}
function randomize() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  state.dir = pick(['cw', 'ccw']); state.step = pick([45, 90, 180]); state.size = pick(['dec', 'same', 'inc']);
  syncControls();
  changed('Random settings: ' + refs.dir.selectedOptions[0].text + ', ' + state.step + ' degrees, ' + refs.size.selectedOptions[0].text);
  refs.row.scrollTo({ left: 0 });
}

/* ---------- saving ---------- */
function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      items: state.items.map(({ shape, color, size }) => ({ shape, color, size })),
      dir: state.dir, step: state.step, size: state.size, numbers: state.numbers, outline: state.outline, every: state.every
    }));
  } catch (e) { /* storage unavailable */ }
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!d || !Array.isArray(d.items)) return false;
    state.items = d.items.slice(0, MAX_ITEMS)
      .filter(x => x && GEOM[x.shape] && COLOR_HEX[x.color])
      .map(x => ({ id: ++state.nid, shape: x.shape, color: x.color, size: clamp(Math.round(+x.size) || DEFAULT_SIZE, MIN_SIZE, MAX_SIZE) }));
    if (d.dir === 'cw' || d.dir === 'ccw') state.dir = d.dir;
    if ([45, 90, 180].includes(d.step)) state.step = d.step;
    if (['dec', 'same', 'inc'].includes(d.size)) state.size = d.size;
    state.numbers = !!d.numbers; state.outline = !!d.outline; state.every = !!d.every;
    return true;
  } catch (e) { return false; }
}

/* ---------- start up ---------- */
function init() {
  Object.assign(refs, {
    row: $('#row'), items: $('#items'), rowEmpty: $('#rowEmpty'), palette: $('#palette'), list: $('#list'), empty: $('#empty'),
    status: $('#status'), summary: $('#summary'), liveNote: $('#liveNote'),
    dir: $('#dir'), dirArrow: $('#dirArrow'), step: $('#step'), size: $('#size'), optNumbers: $('#optNumbers'), optOutline: $('#optOutline'), optEvery: $('#optEvery')
  });
  if (!restore()) state.items = defaultItems();
  syncControls();

  SHAPES.forEach(s => {
    const b = el('button', { type: 'button', class: 'pal', 'aria-label': 'Add ' + s, title: 'Add ' + s });
    b.append(icon(s, PALETTE_PAINT));
    b.addEventListener('click', () => addShape(s));
    refs.palette.append(b);
  });

  refs.dir.addEventListener('change', () => { state.dir = refs.dir.value; syncDirIcon(); changed(); });
  refs.step.addEventListener('change', () => { state.step = +refs.step.value; changed(); });
  refs.size.addEventListener('change', () => { state.size = refs.size.value; changed(); });
  refs.optNumbers.addEventListener('change', () => { state.numbers = refs.optNumbers.checked; changed(); });
  refs.optOutline.addEventListener('change', () => { state.outline = refs.optOutline.checked; changed(); });
  refs.optEvery.addEventListener('change', () => { state.every = refs.optEvery.checked; changed(); });
  $('#rand').addEventListener('click', randomize);
  $('#prev').addEventListener('click', () => stepItem(-1));
  $('#next').addEventListener('click', () => stepItem(1));

  // turn a vertical mouse wheel into sideways scrolling along the row
  refs.row.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { refs.row.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });

  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(refs.row);
  else window.addEventListener('resize', onResize);
  setUnit();

  updateSummary();
  renderList();
  renderRow();
  setStatus();
}

/* __EXPOSE__ */
init();
})();
</script>
</body>
</html>
